# Accountless hot-reload overlay on top of the client-only compose.yaml.
# Usage (from the docker/ directory):
#   docker compose -f compose.yaml -f compose.dev.yaml up --build -d
services:
  client:
    build:
      context: ..
      target: development-stage
      args:
        NEXT_PUBLIC_APP_PLATFORM: web
    environment:
      # Required so pnpm does not abort when purging node_modules without a TTY
      CI: "true"
    # Mount source for hot reload while keeping dependencies and generated
    # assets container-owned. Runtime service/asset URLs are inherited from
    # compose.yaml; no login or backend stack is added for development.
    volumes:
      - ../:/app
      - /app/node_modules
      - /app/apps/readest-app/node_modules
      - /app/apps/readest-app/public/vendor
      - /app/apps/readest-app/.next
      - /app/packages/foliate-js/node_modules
