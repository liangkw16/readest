name: readest

services:
  client:
    container_name: readest-client
    image: ${READEST_IMAGE:-ghcr.io/liangkw16/readest:latest}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "${READEST_PORT:-3000}:3000"
    environment:
      # Public origin used for metadata and generated links. The application
      # itself remains fully usable on localhost when this is left unchanged.
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}

      # Empty API/Node URLs keep requests same-origin. Set either variable only
      # when routing those endpoints to a user-owned compatible service.
      API_BASE_URL: ${API_BASE_URL:-}
      NODE_BASE_URL: ${NODE_BASE_URL:-}

      # Optional user-hosted assets and metadata provider credentials.
      FONT_BASE_URL: ${FONT_BASE_URL:-}
      WORDLENS_BASE_URL: ${WORDLENS_BASE_URL:-}
      GOOGLE_BOOKS_API_KEYS: ${GOOGLE_BOOKS_API_KEYS:-}
